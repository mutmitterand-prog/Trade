<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trading Terminal - MUTMITT</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">

    <h1>MUTMITT - Terminal Trading</h1>

    <!-- DASHBOARD -->
    <div class="stats-grid">

        <div id="card-day" class="stat-card">
            <div class="stat-label">Bilan Jour</div>
            <div id="pnl-day" class="stat-val">0.00 $</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Bilan Semaine</div>
            <div id="pnl-week" class="stat-val">0.00 $</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Bilan Mois</div>
            <div id="pnl-month" class="stat-val">0.00 $</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Bilan Année</div>
            <div id="pnl-year" class="stat-val">0.00 $</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Winrate</div>
            <div id="winrate" class="stat-val">0%</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Trades</div>
            <div id="total-trades" class="stat-val">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Drawdown</div>
            <div id="drawdown" class="stat-val">0.00 $</div>
        </div>

    </div>

    <!-- MONEY MANAGEMENT -->
    <div class="mm-box">

        <div class="mm-item">
            <label>Capital Initial</label>
            <input type="number" id="mm-balance-init" value="100">
        </div>

        <div class="mm-item">
            <label>Objectif Jour</label>
            <input type="number" id="mm-target-day" value="20">
        </div>

        <div class="mm-item">
            <label>Capital Actuel</label>
            <div id="current-balance" class="mm-res">100 $</div>
        </div>

        <div class="mm-item">
            <label>Risque %</label>
            <select id="mm-risk-percent">
                <option value="1">1%</option>
                <option value="2" selected>2%</option>
                <option value="5">5%</option>
            </select>
        </div>

        <div class="mm-item">
            <label>Perte Max</label>
            <div id="mm-allowed-loss" class="mm-res">2 $</div>
        </div>

        <div class="mm-item">
            <label>Session</label>
            <select id="session-select">
                <option value="all">Toute la journée</option>
                <option value="morning">Morning</option>
                <option value="evening">Evening</option>
            </select>
        </div>

        <div class="mm-item">
            <label>ATR</label>
            <input type="number" id="atr-input" placeholder="ATR">
        </div>

        <div class="mm-item">
            <label>ATR Status</label>
            <div id="atr-status">En attente</div>
        </div>

        <div class="mm-item">
            <label>Trading Status</label>
            <div id="trading-status">Check...</div>
        </div>

    </div>

    <!-- CHART -->
    <div class="card">
        <h2>Equity Curve</h2>
        <canvas id="equityChart"></canvas>
    </div>

    <!-- CHECKLIST -->
    <div class="card">

        <h2>Checklist</h2>

        <label><input type="checkbox" class="t-check"> RSI OK</label>
        <label><input type="checkbox" class="t-check"> EMA OK</label>
        <label><input type="checkbox" class="t-check"> Stoch OK</label>
        <label><input type="checkbox" class="t-check"> Confluence OK</label>

        <div id="check-status">0/4</div>
    </div>

    <!-- AI -->
    <div id="ai-box" class="card">
        <h2>AI ANALYSIS</h2>
        <p>Loading...</p>
    </div>

    <!-- JOURNAL -->
    <div class="section-box">

        <h2>Journal de Bord</h2>

        <div class="journal-form">

            <select id="j-market">
                <option>V75</option>
                <option>V100</option>
                <option>Boom 1000</option>
                <option>Crash 1000</option>
            </select>

            <select id="j-result">
                <option>Gain</option>
                <option>Perte</option>
                <option>BE</option>
            </select>

            <input type="number" id="j-pnl" placeholder="P&L">
            <input type="text" id="j-note" placeholder="Note">

            <button id="add-trade-btn">AJOUTER</button>

        </div>

        <select id="market-filter">
            <option value="all">Tous</option>
            <option value="V75">V75</option>
            <option value="V100">V100</option>
            <option value="Boom 1000">Boom 1000</option>
            <option value="Crash 1000">Crash 1000</option>
        </select>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Market</th>
                        <th>Résultat</th>
                        <th>P&L</th>
                        <th>Note</th>
                        <th>X</th>
                    </tr>
                </thead>
                <tbody id="journal-body"></tbody>
            </table>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
